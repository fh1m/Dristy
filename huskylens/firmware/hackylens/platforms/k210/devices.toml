schema = 1
platform = "kendryte-k210"
reset_profiles = ["huskylens-uploader", "manual"]
reboot_profiles = ["uploader-normal"]
usb_detection_modes = ["vid-any", "explicit-port"]
flash_types = ["spi0"]
flash_modes = ["qio", "dio"]
peripheral_instances = [
  "timer0", "timer2", "gpiohs", "spi0", "spi1", "spi3", "dvp", "sccb",
  "uart1", "i2c0",
]
runtime_base_devices = [
  "processor",
  "internal-flash",
  "display",
  "buttons",
  "lights",
  "sd-card",
  "external-uart",
  "external-i2c",
]

[devices.k210]
kind = "processor"
allowed_drivers = ["k210-core"]

[devices.board-internal-flash]
kind = "internal-flash"
allowed_drivers = ["boot-flash"]

[devices.gd25lq128]
kind = "internal-flash"
allowed_drivers = ["boot-flash"]

[devices.st7789v]
kind = "display"
allowed_drivers = ["lcd-st7789"]

[devices.ov2640]
kind = "camera"
allowed_drivers = ["camera-ov2640"]

[devices.ov7740]
kind = "camera"
allowed_drivers = []

[devices.huskylens-buttons]
kind = "buttons"
allowed_drivers = ["huskylens-buttons"]

[devices.top-3way]
kind = "buttons"
allowed_drivers = []

[devices.huskylens-lights]
kind = "lights"
allowed_drivers = ["huskylens-lights"]

[devices.cube-lights]
kind = "lights"
allowed_drivers = []

[devices.sd-spi]
kind = "sd-card"
allowed_drivers = ["sd-spi"]

[devices.grove-uart]
kind = "external-uart"
allowed_drivers = ["external-uart"]

[devices.grove-i2c]
kind = "external-i2c"
allowed_drivers = ["external-i2c"]

[devices.axp173]
kind = "power-management"
allowed_drivers = []

[devices.es8374]
kind = "audio-codec"
allowed_drivers = []

[devices.msa301]
kind = "accelerometer"
allowed_drivers = []

[functions.timer0-toggle1]
peripheral = "timer0"
macro = "FUNC_TIMER0_TOGGLE1"

[functions.timer2-toggle1]
peripheral = "timer2"
macro = "FUNC_TIMER2_TOGGLE1"

[functions.timer2-toggle2]
peripheral = "timer2"
macro = "FUNC_TIMER2_TOGGLE2"

[functions.timer2-toggle3]
peripheral = "timer2"
macro = "FUNC_TIMER2_TOGGLE3"

[functions.timer2-toggle4]
peripheral = "timer2"
macro = "FUNC_TIMER2_TOGGLE4"

[functions.gpiohs2]
peripheral = "gpiohs"
macro = "FUNC_GPIOHS2"

[functions.gpiohs3]
peripheral = "gpiohs"
macro = "FUNC_GPIOHS3"

[functions.gpiohs4]
peripheral = "gpiohs"
macro = "FUNC_GPIOHS4"

[functions.gpiohs5]
peripheral = "gpiohs"
macro = "FUNC_GPIOHS5"

[functions.gpiohs6]
peripheral = "gpiohs"
macro = "FUNC_GPIOHS6"

[functions.gpiohs14]
peripheral = "gpiohs"
macro = "FUNC_GPIOHS14"

[functions.gpiohs15]
peripheral = "gpiohs"
macro = "FUNC_GPIOHS15"

[functions.spi0-ss3]
peripheral = "spi0"
macro = "FUNC_SPI0_SS3"

[functions.spi0-sclk]
peripheral = "spi0"
macro = "FUNC_SPI0_SCLK"

[functions.spi0-d0]
peripheral = "spi0"
macro = "FUNC_SPI0_D0"

[functions.spi1-sclk]
peripheral = "spi1"
macro = "FUNC_SPI1_SCLK"

[functions.spi1-d0]
peripheral = "spi1"
macro = "FUNC_SPI1_D0"

[functions.spi1-d1]
peripheral = "spi1"
macro = "FUNC_SPI1_D1"

[functions.cmos-pclk]
peripheral = "dvp"
macro = "FUNC_CMOS_PCLK"

[functions.cmos-xclk]
peripheral = "dvp"
macro = "FUNC_CMOS_XCLK"

[functions.cmos-href]
peripheral = "dvp"
macro = "FUNC_CMOS_HREF"

[functions.cmos-pwdn]
peripheral = "dvp"
macro = "FUNC_CMOS_PWDN"

[functions.cmos-vsync]
peripheral = "dvp"
macro = "FUNC_CMOS_VSYNC"

[functions.cmos-rst]
peripheral = "dvp"
macro = "FUNC_CMOS_RST"

[functions.sccb-sclk]
peripheral = "sccb"
macro = "FUNC_SCCB_SCLK"

[functions.sccb-sda]
peripheral = "sccb"
macro = "FUNC_SCCB_SDA"

[functions.uart1-rx]
peripheral = "uart1"
macro = "FUNC_UART1_RX"

[functions.uart1-tx]
peripheral = "uart1"
macro = "FUNC_UART1_TX"

[functions.i2c0-sclk]
peripheral = "i2c0"
macro = "FUNC_I2C0_SCLK"

[functions.i2c0-sda]
peripheral = "i2c0"
macro = "FUNC_I2C0_SDA"

[route_roles.IO_LCD_BL]
function = "timer0-toggle1"
peripheral = "timer0"

[route_roles.IO_LCD_DC_OR_AUX]
function = "gpiohs15"
peripheral = "gpiohs"

[route_roles.IO_LCD_CS]
function = "spi0-ss3"
peripheral = "spi0"

[route_roles.IO_LCD_SCLK]
function = "spi0-sclk"
peripheral = "spi0"

[route_roles.IO_LCD_RST]
function = "gpiohs14"
peripheral = "gpiohs"

[route_roles.IO_LCD_MOSI]
function = "spi0-d0"
peripheral = "spi0"

[route_roles.IO_LED_ILLUM]
function = "timer2-toggle4"
peripheral = "timer2"

[route_roles.IO_RGB_PWM0]
function = "timer2-toggle1"
peripheral = "timer2"

[route_roles.IO_RGB_PWM1]
function = "timer2-toggle2"
peripheral = "timer2"

[route_roles.IO_RGB_PWM2]
function = "timer2-toggle3"
peripheral = "timer2"

[route_roles.IO_BTN_LEFT]
function = "gpiohs2"
peripheral = "gpiohs"

[route_roles.IO_BTN_OK]
function = "gpiohs3"
peripheral = "gpiohs"

[route_roles.IO_BTN_RIGHT]
function = "gpiohs4"
peripheral = "gpiohs"

[route_roles.IO_BTN_BACK]
function = "gpiohs5"
peripheral = "gpiohs"

[route_roles.IO_CAM_PCLK]
function = "cmos-pclk"
peripheral = "dvp"

[route_roles.IO_CAM_XCLK]
function = "cmos-xclk"
peripheral = "dvp"

[route_roles.IO_CAM_HREF]
function = "cmos-href"
peripheral = "dvp"

[route_roles.IO_CAM_PWDN]
function = "cmos-pwdn"
peripheral = "dvp"

[route_roles.IO_CAM_VSYNC]
function = "cmos-vsync"
peripheral = "dvp"

[route_roles.IO_CAM_RST]
function = "cmos-rst"
peripheral = "dvp"

[route_roles.IO_CAM_SCCB_SCLK]
function = "sccb-sclk"
peripheral = "sccb"

[route_roles.IO_CAM_SCCB_SDA]
function = "sccb-sda"
peripheral = "sccb"

[route_roles.IO_SD_SCLK]
function = "spi1-sclk"
peripheral = "spi1"

[route_roles.IO_SD_D0]
function = "spi1-d0"
peripheral = "spi1"

[route_roles.IO_SD_D1]
function = "spi1-d1"
peripheral = "spi1"

[route_roles.IO_SD_CS]
function = "gpiohs6"
peripheral = "gpiohs"

[route_roles.IO_EXTERNAL_UART_R]
function = "uart1-rx"
peripheral = "uart1"

[route_roles.IO_EXTERNAL_UART_T]
function = "uart1-tx"
peripheral = "uart1"

[route_roles.IO_EXTERNAL_I2C_R]
function = "i2c0-sclk"
peripheral = "i2c0"

[route_roles.IO_EXTERNAL_I2C_T]
function = "i2c0-sda"
peripheral = "i2c0"

[route_roles.IO_TOP_3WAY_KEY1]
function = "gpiohs2"
peripheral = "gpiohs"

[route_roles.IO_TOP_3WAY_KEY2]
function = "gpiohs3"
peripheral = "gpiohs"

[route_roles.IO_TOP_3WAY_BOOT_KEY]
function = "gpiohs4"
peripheral = "gpiohs"

[legacy_runtime_muxes.external-four-pin-mode]
routes = [
  { macro = "IO_EXTERNAL_UART_R", function = "uart1-rx", pin = 34, peripheral = "uart1" },
  { macro = "IO_EXTERNAL_UART_T", function = "uart1-tx", pin = 35, peripheral = "uart1" },
  { macro = "IO_EXTERNAL_I2C_R", function = "i2c0-sclk", pin = 34, peripheral = "i2c0" },
  { macro = "IO_EXTERNAL_I2C_T", function = "i2c0-sda", pin = 35, peripheral = "i2c0" },
]

[prepare_callbacks]
display = "display_prepare"
camera = "camera_prepare"
buttons = "buttons_prepare"
lights = "lights_prepare"
internal-flash = "internal_flash_prepare"
sd-card = "sd_prepare"
external-uart = "external_uart_prepare"
external-i2c = "external_i2c_prepare"

[runtime_profiles.hackylens-full]
required_devices = [
  "processor",
  "internal-flash",
  "display",
  "camera",
  "buttons",
  "lights",
  "sd-card",
  "external-uart",
  "external-i2c",
]
