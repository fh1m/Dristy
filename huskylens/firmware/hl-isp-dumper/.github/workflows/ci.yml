name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: _deps
          key: kendryte-8.2.0-20190409-sdk-02576ba67e8797444f3ee3f34c625b5ed048e707
      - name: Bootstrap pinned dependencies
        run: python tools/bootstrap_deps.py
      - name: Build SRAM ISP stub
        run: python tools/build.py
      - name: Run host-side tests
        run: python -m unittest discover -s tests -v
      - name: Verify committed release binary
        run: git diff --exit-code -- isp_prog_huskylens.bin
      - name: Verify ELF entry point
        run: _deps/kendryte-toolchain/bin/riscv64-unknown-elf-readelf -h build/isp_stub.elf | grep -q 'Entry point address:.*0x80000000'
      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: huskylens-isp-stub
          path: |
            build/isp_prog_huskylens.bin
            build/isp_stub.elf
            build/isp_stub.map

