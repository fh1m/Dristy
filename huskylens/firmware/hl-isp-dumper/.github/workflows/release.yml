name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: _deps
          key: kendryte-8.2.0-20190409-sdk-02576ba67e8797444f3ee3f34c625b5ed048e707
      - name: Bootstrap pinned dependencies
        run: python tools/bootstrap_deps.py
      - name: Build and test
        run: |
          python tools/build.py
          python -m unittest discover -s tests -v
          git diff --exit-code -- isp_prog_huskylens.bin
      - name: Prepare checksums
        run: sha256sum build/isp_prog_huskylens.bin > build/isp_prog_huskylens.bin.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/isp_prog_huskylens.bin \
            build/isp_prog_huskylens.bin.sha256 \
            build/isp_stub.elf \
            build/isp_stub.map \
            --verify-tag \
            --title "HuskyLens ISP Stub $GITHUB_REF_NAME" \
            --generate-notes

