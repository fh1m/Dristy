[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "huskylens-open-platform"
version = "0.1.0"
description = "Open driver, characterization tooling and custom firmware workflow for the DFRobot HUSKYLENS (Kendryte K210)"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]
