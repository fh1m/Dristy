<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="IBM Plex Mono, ui-monospace, monospace">
<rect width="960" height="300" rx="10" fill="#0b0e12"/>
<text x="32" y="44" fill="#eef1f5" font-size="18" font-family="IBM Plex Sans, system-ui, sans-serif" font-weight="600">One tracked object on the wire: 22 bytes</text>
<text x="32" y="68" fill="#8a94a3" font-size="13" font-family="IBM Plex Sans, system-ui, sans-serif">Stock 0x55 0xAA camera framing, Dristy command range 0x40–0x7F. The robot reads numbers, not pictures.</text>
<g font-size="14">
<rect x="32" y="100" width="120" height="56" fill="#13202c" stroke="#2a3a4a"/><text x="92" y="134" fill="#00a0ff" text-anchor="middle">55 AA</text>
<rect x="152" y="100" width="70" height="56" fill="#13202c" stroke="#2a3a4a"/><text x="187" y="134" fill="#eef1f5" text-anchor="middle">11</text>
<rect x="222" y="100" width="70" height="56" fill="#13202c" stroke="#2a3a4a"/><text x="257" y="134" fill="#eef1f5" text-anchor="middle">len</text>
<rect x="292" y="100" width="90" height="56" fill="#1c2a1a" stroke="#3b5a35"/><text x="337" y="134" fill="#8dff6a" text-anchor="middle">50</text>
<rect x="382" y="100" width="440" height="56" fill="#13202c" stroke="#2a3a4a"/><text x="602" y="124" fill="#eef1f5" text-anchor="middle">id · cx · cy · w · h · vx · vy · age</text><text x="602" y="144" fill="#8a94a3" text-anchor="middle" font-size="12">16-byte payload, eight u16 fields</text>
<rect x="822" y="100" width="106" height="56" fill="#2a1616" stroke="#5a3333"/><text x="875" y="134" fill="#ff8f80" text-anchor="middle">sum</text>
</g>
<g font-size="12" fill="#8a94a3" font-family="IBM Plex Sans, system-ui, sans-serif">
<text x="92" y="180" text-anchor="middle">sync</text><text x="187" y="180" text-anchor="middle">protocol</text><text x="257" y="180" text-anchor="middle">length</text><text x="337" y="180" text-anchor="middle">RETURN_TRACK</text><text x="602" y="180" text-anchor="middle">what the camera decided</text><text x="875" y="180" text-anchor="middle">checksum</text>
<text x="32" y="232" fill="#eef1f5" font-size="14">A 320×240 RGB565 frame is 153,600 bytes. This answer is 22.</text>
<text x="32" y="256">At 115200 baud that is about 1.9 ms on the wire, so the flight controller's loop never waits on vision.</text>
</g></svg>
